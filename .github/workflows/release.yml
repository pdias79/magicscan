name: Publish Windows Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches CMake version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(magicscan VERSION ([0-9]+[.][0-9]+(?:[.][0-9]+)?)') { throw "Version CMake introuvable" }
          $cmakeVersion = $Matches[1]
          if ($tag -notmatch '^v[0-9]+[.][0-9]+$') { throw "Format de tag invalide : $tag" }
          if ($tag -ne "v$cmakeVersion") { throw "Le tag $tag ne correspond pas a la version CMake $cmakeVersion" }
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows portable ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          ./scripts/package-windows.ps1 -BuildDir build -OutputDir dist -Version $version
      - name: Verify archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $archive = "dist/MagicScan-$version-win64.zip"
          if (-not (Test-Path $archive)) { throw "Archive absente" }
          Expand-Archive -LiteralPath $archive -DestinationPath verify
          foreach ($item in @("magicscan-tray.exe", "magicscan.exe", "LISEZ-MOI.md")) {
            if (-not (Test-Path "verify/MagicScan-$version-win64/$item")) { throw "Fichier manquant : $item" }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe",
            "${env:ProgramFiles}\\Inno Setup 6\\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup compiler not found" }
          & $compiler ".\\installer\\MagicScan.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          $version = "${{ github.ref_name }}".Substring(1)
          if (-not (Test-Path "dist/MagicScan-$version-setup-win64.exe")) {
            throw "Installer not generated"
          }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          gh release create "${{ github.ref_name }}" "dist/MagicScan-$version-win64.zip" "dist/MagicScan-$version-setup-win64.exe" --verify-tag --title "MagicScan ${{ github.ref_name }}" --generate-notes
